<!doctype html>
<html lang="ka"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎓 {{TITLE}} — ლექტორისთვის</title>
{{FONTS}}
<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#1e2132;--ink2:#3b3f54;--muted:#7b8096;--line:#e4ddcf;--line2:#d6cdbb;
  --accent:#6d28d9;--accent-soft:#f3effe;--teal:#0d9488;--green:#15803d;--amber:#b45309;--red:#b91c1c;--blue:#1d4ed8;
  --g-prep:#2563eb;--g-flow:#6d28d9;--g-after:#0d9488;--g-mat:#64748b;--g-ready:#15803d;
  --mono:"JetBrains Mono",ui-monospace,monospace;--sans:"Noto Sans Georgian",system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-padding-top:84px;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 20px;background:rgba(244,241,234,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .back{font:600 14px var(--mono);color:var(--muted);text-decoration:none;white-space:nowrap}
.top .back:hover{color:var(--ink)}
.top .ttl{flex:1;min-width:0;font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{font:500 13px var(--mono);color:var(--muted);margin-right:8px}
.btn{font:700 14px var(--sans);text-decoration:none;border-radius:10px;padding:7px 13px;white-space:nowrap;border:1px solid var(--line2);color:var(--ink);background:var(--card);cursor:pointer}
.btn:hover{border-color:var(--ink2)}
.btn.play{background:var(--accent);border-color:var(--accent);color:#fff}
.mode{display:flex;background:#e9e3d6;border-radius:12px;padding:3px;gap:2px}
.mode button{font:700 14px var(--sans);border:0;background:transparent;color:var(--ink2);padding:6px 14px;border-radius:9px;cursor:pointer;white-space:nowrap}
.mode button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.timer{display:none;align-items:center;gap:8px;font:700 14px var(--mono);background:var(--ink);color:#fff;border-radius:10px;padding:6px 6px 6px 12px}
.timer button{font:700 13px var(--sans);border:0;border-radius:7px;padding:3px 10px;cursor:pointer;background:rgba(255,255,255,.16);color:#fff}
.timer .plan{font:600 12.5px var(--sans);color:#c9c4ff;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body[data-mode=live] .timer{display:flex}
.follow{display:none;align-items:center;gap:7px;font:600 13px var(--mono);color:var(--teal);background:#e6f6f4;border:1px solid #bfe7e2;border-radius:999px;padding:5px 12px}
.follow.on{display:flex}.follow .dot{width:8px;height:8px;border-radius:50%;background:var(--teal);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
/* ---------- layout ---------- */
.wrap{display:grid;grid-template-columns:280px minmax(0,920px);gap:36px;justify-content:center;padding:28px 24px 140px}
nav.side{position:sticky;top:76px;align-self:start;max-height:calc(100vh - 92px);overflow:auto;padding-right:4px;font-size:14px;line-height:1.35}
.prog{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:14px}
.prog .pl{display:flex;justify-content:space-between;font:700 12.5px var(--mono);color:var(--muted)}
.prog .pl b{color:var(--green)}
.prog .bar{height:7px;border-radius:9px;background:#ece6da;margin-top:7px;overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--green);border-radius:9px;transition:width .3s}
.ng{font:700 11.5px var(--mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:16px 0 6px 4px}
nav.side a{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:10px;color:var(--ink2);text-decoration:none;position:relative}
nav.side a:hover{background:#ebe5d8}
nav.side a.cur{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.08)}
nav.side .nn{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 12px var(--mono);background:#e6e0d3;color:var(--ink2)}
nav.side .nn.e{background:transparent;font-size:15px}
nav.side a[data-g=flow] .nn:not(.e){background:var(--accent-soft);color:var(--accent)}
nav.side a.ok .nn{background:var(--green);color:#fff}
nav.side a.ok .nn::after{content:"✓";position:absolute;font-size:12px}
nav.side a.ok .nn{color:transparent;position:relative}
nav.side .nt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.side .nm{flex:none;font:600 11.5px var(--mono);color:var(--muted)}
nav.side a.now{outline:2px solid var(--teal);outline-offset:-2px}
nav.side a.now::before{content:"";position:absolute;left:-10px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--teal)}
/* ---------- hero ---------- */
header.hero .k{font:600 14px var(--mono);color:var(--accent)}
header.hero h1{font-size:36px;line-height:1.2;margin:6px 0 10px;letter-spacing:-.01em}
header.hero p{color:var(--ink2);margin:0 0 18px;font-size:16px;max-width:780px}
.tl{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px 14px;margin-bottom:8px}
.tlh{display:flex;justify-content:space-between;font:700 12.5px var(--mono);color:var(--muted);margin-bottom:8px}
.segs{position:relative;display:flex;gap:3px;height:64px}
.seg{min-width:0;display:flex;flex-direction:column;justify-content:center;padding:4px 8px;border-radius:9px;background:var(--accent-soft);color:var(--accent);text-decoration:none;border:1px solid #e0d6fb;overflow:hidden}
.seg:hover{border-color:var(--accent)}
.seg b{font:700 13px var(--mono);line-height:1.3}
.seg span{font-size:12px;line-height:1.25;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg i{font:600 11px var(--mono);font-style:normal;color:var(--muted)}
.seg.brk{background:#f1ede4;border-color:var(--line);color:var(--muted)}
.seg.now{background:var(--accent);color:#fff;border-color:var(--accent)}.seg.now span,.seg.now i{color:#efe9ff}
.cursor{display:none;position:absolute;top:-6px;bottom:-6px;width:3px;margin-left:-1.5px;background:var(--red);border-radius:2px}
.cursor.on{display:block}
/* ---------- groups & parts ---------- */
.grp{display:flex;align-items:center;gap:12px;margin:52px 0 16px;font:800 14px var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--gc)}
.grp span{font-size:20px}
.grp::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--gc),transparent);opacity:.35}
[data-g=prep]{--gc:var(--g-prep)}[data-g=flow]{--gc:var(--g-flow)}[data-g=after]{--gc:var(--g-after)}[data-g=mat]{--gc:var(--g-mat)}[data-g=ready]{--gc:var(--g-ready)}
.part{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--gc);border-radius:18px;margin:0 0 22px;box-shadow:0 2px 10px rgba(40,30,10,.05);scroll-margin-top:84px}
.part.now{box-shadow:0 0 0 3px var(--teal),0 6px 20px rgba(13,148,136,.15)}
.ph{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line)}
.pn{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font:800 18px var(--mono);background:var(--gc);color:#fff}
.pn.e{background:color-mix(in srgb,var(--gc) 10%,#fff);font-size:22px}
.pht{flex:1;min-width:0}
.ph h2{font-size:22px;line-height:1.3;margin:0}
.pm{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.pm:empty{display:none}
.pt,.ps{font:600 12.5px var(--mono);border-radius:999px;padding:2px 10px;text-decoration:none}
.pt{background:#f1ede4;color:var(--ink2)}
.ps{background:var(--accent-soft);color:var(--accent);border:1px solid #e0d6fb}.ps:hover{border-color:var(--accent)}
.done{flex:none;font:700 13px var(--sans);border:1px solid var(--line2);background:var(--card);color:var(--ink2);border-radius:10px;padding:6px 12px;cursor:pointer}
.done:hover{border-color:var(--green);color:var(--green)}
.part.ok .done{background:#ecfdf3;border-color:#86efac;color:var(--green)}
.part.ok .ph{background:linear-gradient(90deg,#f3fbf5,transparent 60%)}
.pbody{padding:6px 20px 20px}
.part details>summary{list-style:none;cursor:pointer}.part details>summary::-webkit-details-marker{display:none}
.part details>summary .ph{border-bottom:0}
.part details>summary .pht::after{content:"▸ გახსენი";font:600 12.5px var(--mono);color:var(--muted)}
.part details[open]>summary .pht::after{content:"▾ დახურე"}
.part details[open]>summary .ph{border-bottom:1px solid var(--line)}
.pintro{color:var(--ink2)}
/* ---------- blocks: one colour per kind ---------- */
.sub{--c:var(--muted);--b:#faf8f3;margin:16px 0 0;border-radius:14px;background:var(--b);border:1px solid color-mix(in srgb,var(--c) 22%,transparent);padding:12px 16px 10px}
.sl{display:inline-flex;align-items:center;gap:6px;font:800 13px var(--sans);color:var(--c);letter-spacing:.01em;margin-bottom:2px}
.sb>:first-child{margin-top:4px}.sb>:last-child{margin-bottom:2px}
.k-main{--c:var(--accent);--b:#f6f2ff}.k-main .sb{font-size:18px;font-weight:600;color:var(--ink)}
.k-deep{--c:var(--blue);--b:#f0f5ff}
.k-how{--c:var(--teal);--b:#effaf8}
.k-ask{--c:var(--amber);--b:#fff7e8}.k-ask .sb strong:first-child{font-size:18.5px;display:block;color:#7c3d06}
.k-myth{--c:var(--red);--b:#fff3f3}
.k-ex{--c:#a16207;--b:#fffbeb}
.k-faq{--c:var(--green);--b:#f3fbf5}
.k-code{--c:var(--ink2);--b:#faf8f3}
.k-must{--c:var(--accent);--b:#f6f2ff}
.k-prep{--c:var(--green);--b:#f3fbf5}
.k-cut{--c:var(--muted);--b:#faf8f3}
.k-prev,.k-next{--c:var(--blue);--b:#f0f5ff}
.k-no{--c:var(--red);--b:#fff3f3}
.k-wrap,.k-rubric{--c:var(--teal);--b:#effaf8}
.k-cheat{--c:#fff;--b:var(--ink);border:0;color:#e8e6f2}
.k-cheat .sl{color:#c9c4ff}
.k-cheat ul{list-style:none;padding:0;margin:6px 0 2px}
.k-cheat li{padding:5px 0 5px 22px;position:relative;border-top:1px solid rgba(255,255,255,.08)}
.k-cheat li:first-child{border-top:0}
.k-cheat li::before{content:"›";position:absolute;left:4px;color:#a5a0ff;font-weight:800}
.k-cheat strong{color:#fff}.k-cheat code{background:rgba(255,255,255,.12)!important;color:#fff!important}
/* checklist */
.k-prep li{list-style:none;position:relative;padding-left:30px;cursor:pointer;user-select:none}
.k-prep ul{padding-left:0}
.k-prep li::before{content:"";position:absolute;left:0;top:4px;width:18px;height:18px;border:2px solid var(--green);border-radius:5px;background:#fff}
.k-prep li.on{color:var(--muted);text-decoration:line-through}
.k-prep li.on::before{background:var(--green);box-shadow:inset 0 0 0 3px #fff}
/* faq inside a block: no second header */
.sub .selfcheck{border:0;background:transparent;padding:0;margin:4px 0 0}
.sub .selfcheck .sh{display:none}
.sub .selfcheck details:first-of-type{border-top:0}
/* ---------- markdown ---------- */
.pbody p{margin:9px 0}
.pbody ul,.pbody ol{padding-left:22px;margin:8px 0}
.pbody li{margin:4px 0}
.pbody h3{font-size:19px;margin:20px 0 6px}.pbody h4{font-size:17px;margin:18px 0 4px}
.pbody :not(pre)>code{font:600 .86em var(--mono);background:#f1ece3;border-radius:6px;padding:1px 6px;color:#5b21b6}
.pbody table{border-collapse:collapse;margin:12px 0;font-size:15.5px;width:100%;display:block;overflow-x:auto}
.pbody th,.pbody td{border:1px solid var(--line);padding:8px 12px;text-align:left;vertical-align:top}
.pbody th{background:#f6f1e8}
.codebox{margin:14px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fffdf9}
.codebox .ch,.prompt .ph2{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 8px 6px 14px;font:600 12.5px var(--mono);color:var(--muted);background:#f6f1e8;border-bottom:1px solid var(--line)}
.copy{font:600 12px var(--mono);border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:7px;padding:3px 10px;cursor:pointer}
.copy.ok{color:var(--green);border-color:var(--green)}
pre.code{margin:0;padding:12px 0;overflow-x:auto;font:14px/1.65 var(--mono)}
pre.code .ln{display:block;padding:0 16px;white-space:pre}
{{TOKEN_CSS}}
.selfcheck{margin:14px 0;border:1px solid #cfe9d6;border-radius:12px;background:#f3fbf5;padding:10px 16px}
.selfcheck .sh{font-weight:700;color:var(--green);margin-bottom:4px}.selfcheck .sh small{font-weight:400;color:var(--muted);font-size:13.5px;margin-left:6px}
.selfcheck details{border-top:1px solid #dcefe1;padding:8px 0}
.selfcheck summary{cursor:pointer;font-weight:600;list-style:none;padding-left:28px;position:relative}
.selfcheck summary::-webkit-details-marker{display:none}
.selfcheck summary::before{content:"?";position:absolute;left:0;top:3px;width:19px;height:19px;border-radius:50%;background:var(--green);color:#fff;font:700 12px/19px var(--mono);text-align:center}
.selfcheck details[open] summary::before{content:"✓"}
.selfcheck .ans{padding:6px 0 2px 28px;color:var(--ink2)}
.callout{display:flex;gap:12px;margin:14px 0;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.callout .ci{font-size:19px;line-height:1.6}.callout>div>p:first-child{margin-top:0}.callout>div>p:last-child{margin-bottom:0}
.callout.warn{background:#fff8eb;border-color:#f6dfb5}.callout.note{background:#eef5ff;border-color:#cfe0fb}
.terms{margin:14px 0;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:10px 16px}
.terms dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:0}.terms dt{font:600 14.5px var(--mono);color:var(--accent)}.terms dd{margin:0}
.prompt{margin:14px 0;border:1px solid #ddd2fb;border-radius:12px;background:var(--accent-soft);padding:10px 14px;white-space:pre-wrap}
.prompt .ph{display:flex;justify-content:space-between;font:600 12.5px var(--mono);color:var(--accent);border:0;padding:0 0 6px}
/* ---------- readiness quiz ---------- */
.qscore{position:sticky;top:66px;z-index:5;display:flex;align-items:center;gap:12px;font:700 14px var(--mono);color:var(--green);background:#ecfdf3;border:1px solid #bbf0cd;border-radius:12px;padding:8px 14px;margin:14px 0 6px}
.qscore .btn{margin-left:auto;padding:4px 12px;font-size:13px}
.qq{border:1px solid var(--line);border-radius:14px;background:#fdfcf9;padding:14px 16px;margin:12px 0}
.qt{font-weight:700;display:flex;gap:10px}
.qn{flex:none;width:26px;height:26px;border-radius:50%;background:#ecfdf3;color:var(--green);font:700 13px/26px var(--mono);text-align:center}
.opts{display:grid;gap:8px;margin:10px 0 4px 36px}
.opt{text-align:left;font:15.5px/1.5 var(--sans);color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--green)}
.opt[disabled]{cursor:default}
.opt.right{background:#ecfdf3;border-color:#86efac;color:#166534;font-weight:600}
.opt.wrong{background:#fef2f2;border-color:#fca5a5;color:#991b1b}
.qe{display:none;margin:8px 0 0 36px;padding:8px 12px;border-radius:10px;background:#f6f1e8;font-size:15.5px;color:var(--ink2)}
.qq.done .qe{display:block}
.qq.ok .verdict::before{content:"✓ სწორია.";color:var(--green);font-weight:700}
.qq.no .verdict::before{content:"✗ არა.";color:var(--red);font-weight:700}
.qsum{display:none;margin-top:14px;padding:14px 16px;border-radius:14px;border:1px solid #cfe9d6;background:#f3fbf5;font-size:17px}
.qsum.on{display:block}
/* ---------- 📋 lecture mode: only the cheat sheet of the flow ---------- */
body[data-mode=live] .part:not([data-g=flow]),body[data-mode=live] .grp:not([data-g=flow]),
body[data-mode=live] nav.side .ng:not([data-g=flow]),body[data-mode=live] nav.side a:not([data-g=flow]),
body[data-mode=live] .pbody>:not(.k-cheat),body[data-mode=live] .done,body[data-mode=live] .prog,body[data-mode=live] header.hero p{display:none}
body[data-mode=live] .part:not([data-cheat]) .pbody{display:none}
body[data-mode=live] .part:not([data-cheat]) .ph{border-bottom:0}
body[data-mode=live] .k-cheat{margin-top:12px;font-size:19px;line-height:1.55}
body[data-mode=live] .k-cheat .sl{display:none}
body[data-mode=live] .grp{margin-top:20px}
body[data-mode=live] .part{margin-bottom:14px}
/* ---------- small screens ---------- */
@media (max-width:1020px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:0;padding:16px 12px 120px}
  nav.side{position:static;max-height:none;margin-bottom:8px}
  nav.side details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
  nav.side details>summary{cursor:pointer;font-weight:700}
  header.hero h1{font-size:28px}
  .top{flex-wrap:wrap;gap:8px;padding:8px 12px}.top .ttl{flex-basis:100%;order:-1}
  .top .back,.top .btn[onclick]{display:none}
  .ph{padding:14px;gap:10px;flex-wrap:wrap}.pbody{padding:4px 14px 16px}
  .seg span{display:none}.segs{height:48px}
}
@media (min-width:1021px){nav.side details>summary{display:none}}
@media print{
  .top,nav.side,.done,.copy,.cursor,.qscore{display:none!important}
  .wrap{display:block;padding:0}body{background:#fff;font-size:13px}
  .part{box-shadow:none;break-inside:avoid;margin-bottom:10px}
  .selfcheck details{display:block}
  .k-cheat{background:#fff;color:var(--ink);border:1px solid var(--ink)}.k-cheat strong{color:var(--ink)}.k-cheat .sl{color:var(--accent)}
  body[data-mode=live] .k-cheat{font-size:13px}
}
</style></head>
<body data-mode="prep">
<div class="top">
  <a class="back" href="../../">← ლექციები</a>
  <div class="ttl"><small>🎓 {{COURSE}} · {{NUM}}</small>{{TITLE}}</div>
  <div class="mode" role="tablist">
    <button type="button" data-m="prep" title="სახლში: სრული მასალა">📚 მომზადება</button>
    <button type="button" data-m="live" title="ლექციაზე: მხოლოდ მოკლე გეგმა">📋 ლექციაზე</button>
  </div>
  <span class="follow" id="follow" title="პრეზენტაცია ღიაა — მიმდინარე თემა ინიშნება"><span class="dot"></span>სლაიდი <b id="fslide">–</b></span>
  <div class="timer" id="timer"><span id="tclock">0:00</span><span class="plan" id="tplan">/ {{TOTAL}} წთ</span><button type="button" id="tbtn">▶ დაწყება</button></div>
  <button class="btn" type="button" onclick="print()" title="დაბეჭდე მიმდინარე რეჟიმი">🖨</button>
  <a class="btn" href="study.html" target="_blank">📖 კონსპექტი</a>
  <a class="btn play" href="index.html" target="_blank">▶ პრეზენტაცია</a>
</div>
<div class="wrap">
  <nav class="side"><details id="navd"><summary>სარჩევი</summary>
    <div class="prog"><div class="pl"><span>მომზადება</span><span><b id="pk">0</b> / <span id="pn">0</span></span></div><div class="bar"><i id="pbar"></i></div></div>
    {{NAV}}
  </details></nav>
  <main>
    <header class="hero">
      <div class="k">🎓 ლექტორისთვის · {{COURSE}} · ლექცია {{NUM}}</div>
      <h1>{{TITLE}}</h1>
      <p>{{INTRO}}</p>
      {{TIMELINE}}
    </header>
    {{BODY}}
  </main>
</div>
<script>
const DECK = {{DECK_TITLE_JSON}};
const store = (k, v) => { try { if (v === undefined) return JSON.parse(localStorage.getItem('lect:' + DECK + ':' + k)); localStorage.setItem('lect:' + DECK + ':' + k, JSON.stringify(v)); } catch (e) { return null; } };
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
if (matchMedia('(min-width:1021px)').matches) $('#navd').open = true;
const parts = $$('.part'), links = $$('nav.side a[href^="#p-"]'), segs = $$('.seg');
const linkOf = p => links.find(a => a.getAttribute('href') === '#' + p.id);

// mode: 📚 prep / 📋 live
function setMode(m) {
  document.body.dataset.mode = m; store('mode', m);
  $$('.mode button').forEach(b => b.classList.toggle('on', b.dataset.m === m));
}
$$('.mode button').forEach(b => b.onclick = () => { setMode(b.dataset.m); scrollTo({ top: 0, behavior: 'instant' }); });
setMode(store('mode') || 'prep');

// prepared ✓ per part + checklist items
const prepParts = parts.filter(p => p.querySelector('.done'));
let ok = store('ok') || [];
function paintOk() {
  prepParts.forEach(p => { const on = ok.includes(p.id); p.classList.toggle('ok', on); linkOf(p)?.classList.toggle('ok', on);
    p.querySelector('.done').textContent = on ? '✓ მომზადებული ვარ' : '☐ მომზადებული ვარ'; });
  const n = prepParts.filter(p => ok.includes(p.id)).length;
  $('#pk').textContent = n; $('#pn').textContent = prepParts.length; $('#pbar').style.width = (100 * n / (prepParts.length || 1)) + '%';
}
document.addEventListener('click', e => {
  const d = e.target.closest('.done'); if (!d) return;
  e.preventDefault(); const id = d.closest('.part').id;
  ok = ok.includes(id) ? ok.filter(x => x !== id) : [...ok, id]; store('ok', ok); paintOk();
});
paintOk();
const checks = $$('.k-prep li'); let ck = store('checks') || [];
checks.forEach((li, i) => { li.classList.toggle('on', ck.includes(i)); li.onclick = () => { ck = ck.includes(i) ? ck.filter(x => x !== i) : [...ck, i]; store('checks', ck); li.classList.toggle('on'); }; });

// sidebar: where am I
const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) links.forEach(a => a.classList.toggle('cur', a === linkOf(x.target))); }), { rootMargin: '-20% 0px -70% 0px' });
parts.forEach(p => io.observe(p));

// copy buttons
document.addEventListener('click', e => {
  const btn = e.target.closest('.copy'); if (!btn) return;
  const box = btn.closest('.codebox, .prompt');
  const text = box.matches('.prompt') ? box.querySelector('.pb').textContent : [...box.querySelectorAll('.ln')].map(l => l.textContent).join('\n');
  navigator.clipboard.writeText(text).then(() => { btn.textContent = '✓ დაკოპირდა'; btn.classList.add('ok'); setTimeout(() => { btn.textContent = 'კოპირება'; btn.classList.remove('ok'); }, 1600); });
});

// follow the deck: the current slide marks its topic
const flow = parts.filter(p => p.dataset.from);
let bc = null; try { bc = new BroadcastChannel('deck-' + DECK); } catch (e) {}
function markNow(p, scroll) {
  parts.forEach(x => x.classList.toggle('now', x === p)); links.forEach(a => a.classList.toggle('now', p && a === linkOf(p)));
  segs.forEach(s => s.classList.toggle('now', p && s.getAttribute('href') === '#' + p.id));
  if (p && scroll && document.body.dataset.mode === 'live') p.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
let lastPart = null;
if (bc) {
  bc.onmessage = ({ data }) => {
    if (data.t !== 'state') return;
    const n = data.i + 1; $('#follow').classList.add('on'); $('#fslide').textContent = n;
    const p = flow.find(x => n >= +x.dataset.from && n <= +x.dataset.to) || null;
    if (p !== lastPart) { lastPart = p; markNow(p, true); }
  };
  bc.postMessage({ t: 'hello' });
}
document.addEventListener('click', e => {   // ▶ slide chip: move an open deck instead of opening a new one
  const c = e.target.closest('[data-go]'); if (!c || !bc || !$('#follow').classList.contains('on')) return;
  e.preventDefault(); bc.postMessage({ t: 'go', n: +c.dataset.go - 1 });
});

// lecture timer: where should I be by the plan
const timed = parts.filter(p => p.dataset.min), total = {{TOTAL}};
let t0 = store('t0');
const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
function tick() {
  const btn = $('#tbtn'), cur = $('#cursor');
  if (!t0) { $('#tclock').textContent = '0:00'; $('#tplan').textContent = '/ ' + total + ' წთ'; btn.textContent = '▶ დაწყება'; cur && cur.classList.remove('on'); return; }
  const s = (Date.now() - t0) / 1000, m = s / 60;
  $('#tclock').textContent = fmt(s); btn.textContent = '■';
  const p = timed.find(x => m >= +x.dataset.start && m < +x.dataset.start + +x.dataset.min);
  $('#tplan').textContent = p ? 'გეგმით: ' + p.querySelector('h2').textContent : (m >= total ? 'დრო ამოიწურა' : '');
  if (cur) { cur.classList.add('on'); cur.style.left = Math.min(100, 100 * m / total) + '%'; }
}
$('#tbtn').onclick = () => { t0 = t0 ? null : Date.now(); store('t0', t0); tick(); };
setInterval(tick, 1000); tick();

// readiness quiz
const quiz = $$('.qq');
function qUpdate() {
  const done = quiz.filter(q => q.classList.contains('done')), good = done.filter(q => q.classList.contains('ok'));
  if (!$('#qs')) return;
  $('#qs').textContent = good.length; $('#qd').textContent = done.length;
  const sum = $('#qsum');
  if (done.length === quiz.length) {
    const bad = quiz.filter(q => q.classList.contains('no'));
    sum.innerHTML = `<b>${good.length} / ${quiz.length}</b> — ` + (bad.length
      ? 'გადახედე ამ კითხვებს და შესაბამის თემებს: ' + bad.map(q => q.querySelector('.qn').textContent).join(', ') + '.'
      : 'ყველაფერი სწორია — ლექციისთვის მზად ხარ. 🎉');
    sum.classList.add('on');
  } else sum.classList.remove('on');
}
document.addEventListener('click', e => {
  const o = e.target.closest('.opt'); if (o) {
    const q = o.closest('.qq'); if (q.classList.contains('done')) return;
    const right = +q.dataset.answer;
    q.querySelectorAll('.opt').forEach((b, i) => { b.disabled = true; if (i === right) b.classList.add('right'); });
    if (+o.dataset.i !== right) o.classList.add('wrong');
    q.classList.add('done', +o.dataset.i === right ? 'ok' : 'no'); qUpdate(); return;
  }
  if (e.target.closest('.qreset')) {
    quiz.forEach(q => { q.classList.remove('done', 'ok', 'no'); q.querySelectorAll('.opt').forEach(b => { b.disabled = false; b.classList.remove('right', 'wrong'); }); });
    qUpdate();
  }
});
</script>
</body></html>
